name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Rewrite asset URLs to use relative paths (repository-safe)
        run: |
          # GitHub Pages serve static sites at the repo subpath (e.g. /<repo>/)
          # All asset references in public/index.html and public/app.js use relative URLs
          # which makes them deploy automatically without modification.
          # Just ensure we copy everything from public/ and add a .nojekyll file so
          # directories and files starting with _ are served correctly.
          touch public/.nojekyll
          ls -lah public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
